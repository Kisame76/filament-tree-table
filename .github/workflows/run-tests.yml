name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing in this workflow writes to the repository, so the token does not get to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3', '8.2']
        laravel: ['^11.0', '^12.0', '^13.0']
        filament: ['^4.3', '^5.0']
        exclude:
          # Laravel 13 requires PHP 8.3.
          - laravel: '^13.0'
            php: '8.2'
        include:
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
          - laravel: '^13.0'
            testbench: '^11.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # CI only: don't let a transient upstream advisory block dependency resolution.
          # It applies to this runner's install and to nobody's else.
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  # The matrix above installs the newest release each constraint allows. This one installs
  # the oldest, so a floor in composer.json that no longer holds (a Filament method that
  # only exists from 4.3, say) fails here instead of in somebody's project.
  #
  # The `rendered` group is left out: those tests mount a table through Livewire::test and
  # draw it, which under Testbench works from Filament 4.13 and fails before reaching any
  # code of this package on the older releases this job installs (Livewire's data store is
  # gone by the time the component renders). The matrix above runs the group on every
  # Filament it can resolve to.
  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # CI only, as above.
          composer config policy.advisories.block false
          composer require "laravel/framework:^11.0" "filament/filament:^4.3" "orchestra/testbench:^9.0" --dev --no-interaction --no-update
          composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --exclude-group=rendered
